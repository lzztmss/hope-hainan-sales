x-api-build: &api-build
  context: ../..
  dockerfile: Dockerfile
  target: api
  args:
    APP_VERSION: ${APP_VERSION:?APP_VERSION 未配置}

x-api-image: &api-image hainan-fttr-heartlink-api:${APP_VERSION:?APP_VERSION 未配置}
x-sqlite-path: &sqlite-path /app/data/app.sqlite

services:
  migrate:
    image: *api-image
    build: *api-build
    command: ["node", "dist-server/server/db/migrate.js"]
    restart: "no"
    environment:
      SQLITE_PATH: *sqlite-path
      MIGRATIONS_DIR: /app/drizzle-sqlite
      NODE_ENV: production
    volumes:
      - sqlite_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  seed:
    image: *api-image
    build: *api-build
    command: ["node", "dist-server/server/db/seed.js"]
    restart: "no"
    environment:
      SQLITE_PATH: *sqlite-path
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME 未配置}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD 未配置}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - sqlite_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: *api-image
    build: *api-build
    restart: unless-stopped
    environment:
      SQLITE_PATH: *sqlite-path
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN 未配置}
      PII_ENCRYPTION_KEY_BASE64: ${PII_ENCRYPTION_KEY_BASE64:?PII_ENCRYPTION_KEY_BASE64 未配置}
      PII_LOOKUP_HMAC_KEY_BASE64: ${PII_LOOKUP_HMAC_KEY_BASE64:?PII_LOOKUP_HMAC_KEY_BASE64 未配置}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TZ: Asia/Shanghai
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    volumes:
      - sqlite_data:/app/data
    networks:
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  web:
    image: hainan-fttr-heartlink-web:${APP_VERSION:?APP_VERSION 未配置}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION 未配置}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup:
    image: *api-image
    build: *api-build
    command: ["node", "dist-server/server/db/backup.js", "backup"]
    profiles: ["maintenance"]
    environment:
      SQLITE_PATH: *sqlite-path
      BACKUP_DIR: /backups
    volumes:
      - sqlite_data:/app/data
      - ${BACKUP_DIR:-./backups}:/backups
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  restore:
    image: *api-image
    build: *api-build
    command: ["node", "dist-server/server/db/backup.js", "restore"]
    profiles: ["maintenance"]
    environment:
      SQLITE_PATH: *sqlite-path
      BACKUP_FILE: ${BACKUP_FILE:-/backups/restore.sqlite}
      CONFIRM_SQLITE_RESTORE: ${CONFIRM_SQLITE_RESTORE:-NO}
    volumes:
      - sqlite_data:/app/data
      - ${BACKUP_DIR:-./backups}:/backups
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sqlite_data:
    name: ${SQLITE_VOLUME_NAME:-hainan_fttr_heartlink_sqlite_data}

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true
