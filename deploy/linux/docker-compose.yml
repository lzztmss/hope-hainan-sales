x-api-build: &api-build
  context: ../..
  dockerfile: Dockerfile
  target: api
  args:
    APP_VERSION: ${APP_VERSION:?APP_VERSION 未配置}

x-api-image: &api-image hainan-fttr-heartlink-api:${APP_VERSION:?APP_VERSION 未配置}
x-database-url: &database-url postgresql://${POSTGRES_USER:?POSTGRES_USER 未配置}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未配置}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB 未配置}

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 未配置}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 未配置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未配置}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  migrate:
    image: *api-image
    build: *api-build
    command: ["node", "dist-server/server/db/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      MIGRATIONS_DIR: /app/drizzle
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  seed:
    image: *api-image
    build: *api-build
    command: ["node", "dist-server/server/db/seed.js"]
    restart: "no"
    environment:
      DATABASE_URL: *database-url
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME 未配置}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD 未配置}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: *api-image
    build: *api-build
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN 未配置}
      PII_ENCRYPTION_KEY_BASE64: ${PII_ENCRYPTION_KEY_BASE64:?PII_ENCRYPTION_KEY_BASE64 未配置}
      PII_LOOKUP_HMAC_KEY_BASE64: ${PII_LOOKUP_HMAC_KEY_BASE64:?PII_LOOKUP_HMAC_KEY_BASE64 未配置}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TZ: Asia/Shanghai
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    networks:
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

  web:
    image: hainan-fttr-heartlink-web:${APP_VERSION:?APP_VERSION 未配置}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION 未配置}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backup:
    image: hainan-fttr-heartlink-ops:${APP_VERSION:?APP_VERSION 未配置}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: ops
      args:
        APP_VERSION: ${APP_VERSION:?APP_VERSION 未配置}
    profiles: ["maintenance"]
    user: "${BACKUP_RUN_UID:-1000}:${BACKUP_RUN_GID:-1000}"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 未配置}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 未配置}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未配置}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:?BACKUP_ENCRYPTION_PASSPHRASE 未配置}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      APP_VERSION: ${APP_VERSION:?APP_VERSION 未配置}
      BACKUP_DIR: /backups
      TZ: Asia/Shanghai
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-hainan_fttr_heartlink_postgres_data}

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true
